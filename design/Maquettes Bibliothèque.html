document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

>/* ============================================================\n   Certflix — Color tokens\n   Dark-first, energetic edu-tech. Signature red + certified green.\n   ============================================================ */\n\n:root {\n  /* ---- Base palette: brand red (\"Certflix Red\") ---- */\n  --red-50:  #FFE9ED;\n  --red-100: #FFC9D2;\n  --red-200: #FF9AAA;\n  --red-300: #FF6E83;\n  --red-400: #FF3D57;   /* signature */\n  --red-500: #F5254A;\n  --red-600: #D6153A;\n  --red-700: #A50E2C;\n\n  /* ---- Certified green (pass / success / momentum) ---- */\n  --green-50:  #DFF9EF;\n  --green-100: #A6EFD3;\n  --green-200: #5FE3B3;\n  --green-300: #12D18E;   /* signature success */\n  --green-400: #0BB77C;\n  --green-500: #089164;\n  --green-600: #066B4A;\n\n  /* ---- Supporting accents ---- */\n  --amber-300: #FFC24B;   /* in-progress / warning */\n  --amber-400: #F5A623;\n  --blue-300:  #4C8DFF;   /* info / links on light */\n  --violet-300:#8B7BFF;   /* decorative accent */\n\n  /* ---- Ink: cool near-black surface ramp (dark theme) ---- */\n  --ink-950: #08080C;   /* page base */\n  --ink-900: #0B0B12;\n  --ink-850: #12121C;   /* elevated surface */\n  --ink-800: #191926;   /* card */\n  --ink-700: #232333;   /* raised card / hover */\n  --ink-600: #2E2E42;   /* border strong */\n  --ink-500: #3B3B52;   /* border */\n  --ink-400: #565676;   /* disabled fg */\n\n  /* ---- Neutral gray ramp (light theme + text) ---- */\n  --gray-0:   #FFFFFF;\n  --gray-50:  #F7F7FB;\n  --gray-100: #EFEFF5;\n  --gray-200: #E2E2EC;\n  --gray-300: #CBCBD9;\n  --gray-400: #A5A5BA;\n  --gray-500: #7C7C95;\n  --gray-600: #5A5A72;\n  --gray-700: #3F3F54;\n  --gray-800: #262635;\n  --gray-900: #14141C;\n\n  /* ---- Text ramp on dark ---- */\n  --white:    #FFFFFF;\n  --text-hi:  #F4F4F8;   /* headings on dark */\n  --text-mid: #B6B6C8;   /* body on dark */\n  --text-lo:  #7E7E96;   /* muted on dark */\n\n  /* =========================================================\n     SEMANTIC ALIASES — default = DARK theme\n     ========================================================= */\n  --brand:            var(--red-400);\n  --brand-hover:      var(--red-300);\n  --brand-press:      var(--red-500);\n  --brand-subtle:     rgba(245, 37, 74, 0.08);\n  --brand-on:         #FFFFFF;\n\n  --accent:           var(--green-400);\n  --accent-hover:     var(--green-300);\n  --accent-subtle:    rgba(11, 183, 124, 0.12);\n\n  /* DEFAULT = LIGHT theme (white-based) */\n  --surface-page:     var(--gray-50);\n  --surface-raised:   var(--gray-0);\n  --surface-card:     var(--gray-0);\n  --surface-card-hi:  var(--gray-50);\n  --surface-inset:    var(--gray-100);\n  --surface-overlay:  rgba(20, 20, 28, 0.45);\n\n  --border:           var(--gray-200);\n  --border-subtle:    var(--gray-100);\n  --border-strong:    var(--gray-300);\n\n  --text-body:        var(--gray-700);\n  --text-heading:     var(--gray-900);\n  --text-muted:       var(--gray-500);\n  --text-inverse:     var(--white);\n  --text-link:        var(--red-500);\n  --text-link-hover:  var(--red-600);\n\n  --focus-ring:       rgba(245, 37, 74, 0.45);\n\n  /* Status */\n  --success:      var(--green-400);\n  --success-subtle: var(--green-50);\n  --warning:      var(--amber-400);\n  --warning-subtle: rgba(245, 166, 35, 0.14);\n  --danger:       var(--red-400);\n  --danger-subtle: rgba(255, 61, 87, 0.12);\n  --info:         var(--blue-300);\n  --info-subtle:  rgba(76, 141, 255, 0.14);\n\n  /* Cloud-provider brand chips (for cert content) */\n  --gcp:   #4285F4;\n  --aws:   #FF9900;\n  --azure: #0089D6;\n}\n\n/* =========================================================\n   LIGHT THEME alias — light is already the default in :root,\n   but class=\"theme-light\" is kept so it can re-assert light\n   inside a dark-scoped region.\n   ========================================================= */\n.theme-light {\n  --surface-page:     var(--gray-50);\n  --surface-raised:   var(--gray-0);\n  --surface-card:     var(--gray-0);\n  --surface-card-hi:  var(--gray-50);\n  --surface-inset:    var(--gray-100);\n  --surface-overlay:  rgba(20, 20, 28, 0.45);\n  --border:           var(--gray-200);\n  --border-subtle:    var(--gray-100);\n  --border-strong:    var(--gray-300);\n  --text-body:        var(--gray-700);\n  --text-heading:     var(--gray-900);\n  --text-muted:       var(--gray-500);\n  --text-link:        var(--red-500);\n  --text-link-hover:  var(--red-600);\n  --brand:            var(--red-500);\n  --brand-subtle:     rgba(245, 37, 74, 0.08);\n  --accent:           var(--green-400);\n  --accent-subtle:    rgba(11, 183, 124, 0.12);\n  --success:          var(--green-400);\n}\n\n/* =========================================================\n   DARK THEME — apply via <body class=\"theme-dark\"> or any scope.\n   The original dark, energetic surface for marketing / hero moments.\n   ========================================================= */\n.theme-dark {\n  --brand:            var(--red-400);\n  --brand-hover:      var(--red-300);\n  --brand-press:      var(--red-500);\n  --brand-subtle:     rgba(255, 61, 87, 0.12);\n\n  --accent:           var(--green-300);\n  --accent-hover:     var(--green-200);\n  --accent-subtle:    rgba(18, 209, 142, 0.14);\n\n  --surface-page:     var(--ink-950);\n  --surface-raised:   var(--ink-850);\n  --surface-card:     var(--ink-800);\n  --surface-card-hi:  var(--ink-700);\n  --surface-inset:    var(--ink-900);\n  --surface-overlay:  rgba(8, 8, 12, 0.72);\n\n  --border:           var(--ink-500);\n  --border-subtle:    var(--ink-600);\n  --border-strong:    var(--ink-400);\n\n  --text-body:        var(--text-mid);\n  --text-heading:     var(--text-hi);\n  --text-muted:       var(--text-lo);\n  --text-link:        var(--red-300);\n  --text-link-hover:  var(--red-200);\n  --focus-ring:       rgba(255, 61, 87, 0.55);\n\n  --success:          var(--green-300);\n  --success-subtle:   var(--green-50);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Certflix — Typography tokens\n   Display: Space Grotesk · Body: Plus Jakarta Sans · Mono: JetBrains Mono\n   ============================================================ */\n\n:root {\n  --font-display: \"Space Grotesk\", \"Segoe UI\", system-ui, sans-serif;\n  --font-body:    \"Plus Jakarta Sans\", system-ui, -apple-system, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", monospace;\n\n  /* Type scale (rem-ish, in px for clarity) — 1.20 minor-third-ish */\n  --fs-display-2xl: 72px;   /* hero */\n  --fs-display-xl:  56px;\n  --fs-display-lg:  44px;\n  --fs-h1:          36px;\n  --fs-h2:          28px;\n  --fs-h3:          22px;\n  --fs-h4:          18px;\n  --fs-body-lg:     18px;\n  --fs-body:        16px;\n  --fs-body-sm:     14px;\n  --fs-caption:     13px;\n  --fs-micro:       11px;\n\n  /* Weights */\n  --fw-light:    300; /* @kind other */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2; /* @kind other */\n  --lh-normal:  1.5; /* @kind other */\n  --lh-relaxed: 1.65; /* @kind other */\n\n  /* Letter spacing */\n  --ls-tight:  -0.02em; /* @kind other */\n  --ls-snug:   -0.01em; /* @kind other */\n  --ls-normal: 0; /* @kind other */\n  --ls-wide:   0.04em; /* @kind other */\n  --ls-caps:   0.08em; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Certflix — Spacing, radius, sizing tokens (4px base grid)\n   ============================================================ */\n\n:root {\n  --space-0:   0;\n  --space-1:   4px;\n  --space-2:   8px;\n  --space-3:   12px;\n  --space-4:   16px;\n  --space-5:   20px;\n  --space-6:   24px;\n  --space-8:   32px;\n  --space-10:  40px;\n  --space-12:  48px;\n  --space-16:  64px;\n  --space-20:  80px;\n  --space-24:  96px;\n  --space-32:  128px;\n\n  /* Radius — friendly, generously rounded */\n  --radius-xs:  6px;\n  --radius-sm:  10px;\n  --radius-md:  14px;\n  --radius-lg:  20px;\n  --radius-xl:  28px;\n  --radius-2xl: 36px;\n  --radius-pill: 999px;\n\n  /* Content widths */\n  --width-prose:   680px;\n  --width-content: 1120px;\n  --width-wide:    1360px;\n\n  /* Control heights */\n  --control-sm: 34px;\n  --control-md: 42px;\n  --control-lg: 52px;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Certflix — Shadows, motion, gradients\n   ============================================================ */\n\n:root {\n  /* Shadows — soft, cool-tinted for dark UI depth */\n  --shadow-xs:  0 1px 2px rgba(0, 0, 0, 0.30);\n  --shadow-sm:  0 2px 8px rgba(0, 0, 0, 0.32);\n  --shadow-md:  0 8px 24px rgba(0, 0, 0, 0.38);\n  --shadow-lg:  0 18px 48px rgba(0, 0, 0, 0.46);\n  --shadow-xl:  0 32px 80px rgba(0, 0, 0, 0.55);\n\n  /* Colored glow — brand focus / featured elements */\n  --glow-brand: 0 8px 32px rgba(255, 61, 87, 0.35);\n  --glow-accent: 0 8px 32px rgba(18, 209, 142, 0.30);\n\n  /* Signature gradients */\n  --grad-brand: linear-gradient(135deg, #FF5A70 0%, #F5254A 100%); /* @kind color */\n  --grad-accent: linear-gradient(135deg, #2FE3A6 0%, #0BB77C 100%); /* @kind color */\n  --grad-ember: linear-gradient(120deg, #FF3D57 0%, #FF7A3D 55%, #FFC24B 100%); /* @kind color */\n  --grad-hero: radial-gradient(120% 120% at 100% 0%, rgba(255,61,87,0.20) 0%, rgba(8,8,12,0) 55%),\n               radial-gradient(100% 100% at 0% 100%, rgba(18,209,142,0.12) 0%, rgba(8,8,12,0) 50%); /* @kind color */\n  --grad-surface: linear-gradient(180deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0) 100%);\n\n  /* Motion — snappy, springy but restrained */\n  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */\n  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */\n  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1); /* @kind other */\n  --dur-fast:   120ms; /* @kind other */\n  --dur-base:   200ms; /* @kind other */\n  --dur-slow:   360ms; /* @kind other */\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Certflix — Base element defaults (opt-in, applied to :root usage)\n   Kept minimal so consumers get sensible link + selection styling.\n   ============================================================ */\n\n:root {\n  color-scheme: light;\n  --selection-bg: rgba(255, 61, 87, 0.24);\n}\n.theme-dark {\n  color-scheme: dark;\n}\n\na {\n  color: var(--text-link);\n  text-decoration: none;\n  transition: color var(--dur-fast) var(--ease-out);\n}\na:hover {\n  color: var(--text-link-hover);\n}\n\n::selection {\n  background: var(--selection-bg);\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   Certflix Design System — global entry point.\n   Consumers link THIS file. Import order matters.\n   ============================================================ */\n\n/* ============================================================\n   Certflix — Webfonts\n   From-scratch brand: fonts sourced from Google Fonts.\n   ============================================================ */\n\n/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4deeaaca-cbc0-4df7-8013-c4520f0adc06\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"023b3761-3bb8-46e2-b750-e3f79741a6ab\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"8936e18f-5128-4a0b-b9be-9b014 t: 700;\n  font-display: swap;\n  src: url(\"1e9f1e5e-3569-4ba1-8b45-c8b345f320a7\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"9f016baf-e0b3-4d90-8ed3-9c7dd8d89220\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* ============================================================\n   Certflix — Color tokens\n   Dark-first, energetic edu-tech. Signature red + certified green.\n   ============================================================ */\n\n:root {\n  /* ---- Base palette: brand red (\"Certflix Red\") ---- */\n  --red-50:  #FFE9ED;\n  --red-100: #FFC9D2;\n  --red-200: #FF9AAA;\n  --red-300: #FF6E83;\n  --red-400: #FF3D57;   /* signature */\n  --red-500: #F5254A;\n  --red-600: #D6153A;\n  --red-700: #A50E2C;\n\n  /* ---- Certified green (pass / success / momentum) ---- */\n  --green-50:  #DFF9EF;\n  --green-100: #A6EFD3;\n  --green-200: #5FE3B3;\n  --green-300: #12D18E;   /* signature success */\n  --green-400: #0BB77C;\n  --green-500: #089164;\n  --green-600: #066B4A;\n\n  /* ---- Supporting accents ---- */\n  --amber-300: #FFC24B;   /* in-progress / warning */\n  --amber-400: #F5A623;\n  --blue-300:  #4C8DFF;   /* info / links on light */\n  --violet-300:#8B7BFF;   /* decorative accent */\n\n  /* ---- Ink: cool near-black surface ramp (dark theme) ---- */\n  --ink-950: #08080C;   /* page base */\n  --ink-900: #0B0B12;\n  --ink-850: #12121C;   /* elevated surface */\n  --ink-800: #191926;   /* card */\n  --ink-700: #232333;   /* raised card / hover */\n  --ink-600: #2E2E42;   /* border strong */\n  --ink-500: #3B3B52;   /* border */\n  --ink-400: #565676;   /* disabled fg */\n\n  /* ---- Neutral gray ramp (light theme + text) ---- */\n  --gray-0:   #FFFFFF;\n  --gray-50:  #F7F7FB;\n  --gray-100: #EFEFF5;\n  --gray-200: #E2E2EC;\n  --gray-300: #CBCBD9;\n  --gray-400: #A5A5BA;\n  --gray-500: #7C7C95;\n  --gray-600: #5A5A72;\n  --gray-700: #3F3F54;\n  --gray-800: #262635;\n  --gray-900: #14141C;\n\n  /* ---- Text ramp on dark ---- */\n  --white:    #FFFFFF;\n  --text-hi:  #F4F4F8;   /* headings on dark */\n  --text-mid: #B6B6C8;   /* body on dark */\n  --text-lo:  #7E7E96;   /* muted on dark */\n\n  /* =========================================================\n     SEMANTIC ALIASES — default = DARK theme\n     ========================================================= */\n  --brand:            var(--red-400);\n  --brand-hover:      var(--red-300);\n  --brand-press:      var(--red-500);\n  --brand-subtle:     rgba(245, 37, 74, 0.08);\n  --brand-on:         #FFFFFF;\n\n  --accent:           var(--green-400);\n  --accent-hover:     var(--green-300);\n  --accent-subtle:    rgba(11, 183, 124, 0.12);\n\n  /* DEFAULT = LIGHT theme (white-based) */\n  --surface-page:     var(--gray-50);\n  --surface-raised:   var(--gray-0);\n  --surface-card:     var(--gray-0);\n  --surface-card-hi:  var(--gray-50);\n  --surface-inset:    var(--gray-100);\n  --surface-overlay:  rgba(20, 20, 28, 0.45);\n\n  --border:           var(--gray-200);\n  --border-subtle:    var(--gray-100);\n  --border-strong:    var(--gray-300);\n\n  --text-body:        var(--gray-700);\n  --text-heading:     var(--gray-900);\n  --text-muted:       var(--gray-500);\n  --text-inverse:     var(--white);\n  --text-link:        var(--red-500);\n  --text-link-hover:  var(--red-600);\n\n  --focus-ring:       rgba(245, 37, 74, 0.45);\n\n  /* Status */\n  --success:      var(--green-400);\n  --success-subtle: var(--green-50);\n  --warning:      var(--amber-400);\n  --warning-subtle: rgba(245, 166, 35, 0.14);\n  --danger:       var(--red-400);\n  --danger-subtle: rgba(255, 61, 87, 0.12);\n  --info:         var(--blue-300);\n  --info-subtle:  rgba(76, 141, 255, 0.14);\n\n  /* Cloud-provider brand chips (for cert content) */\n  --gcp:   #4285F4;\n  --aws:   #FF9900;\n  --azure: #0089D6;\n}\n\n/* =========================================================\n   LIGHT THEME alias — light is already the default in :root,\n   but class=\"theme-light\" is kept so it can re-assert light\n   inside a dark-scoped region.\n   ========================================================= */\n.theme-light {\n  --surface-page:     var(--gray-50);\n  --surface-raised:   var(--gray-0);\n  --surface-card:     var(--gray-0);\n  --surface-card-hi:  var(--gray-50);\n  --surface-inset:    var(--gray-100);\n  --surface-overlay:  rgba(20, 20, 28, 0.45);\n  --border:           var(--gray-200);\n  --border-subtle:    var(--gray-100);\n  --border-strong:    var(--gray-300);\n  --text-body:        var(--gray-700);\n  --text-heading:     var(--gray-900);\n  --text-muted:       var(--gray-500);\n  --text-link:        var(--red-500);\n  --text-link-hover:  var(--red-600);\n  --brand:            var(--red-500);\n  --brand-subtle:     rgba(245, 37, 74, 0.08);\n  --accent:           var(--green-400);\n  --accent-subtle:    rgba(11, 183, 124, 0.12);\n  --success:          var(--green-400);\n}\n\n/* =========================================================\n   DARK THEME — apply via <body class=\"theme-dark\"> or any scope.\n   The original dark, energetic surface for marketing / hero moments.\n   ========================================================= */\n.theme-dark {\n  --brand:            var(--red-400);\n  --brand-hover:      var(--red-300);\n  --brand-press:      var(--red-500);\n  --brand-subtle:     rgba(255, 61, 87, 0.12);\n\n  --accent:           var(--green-300);\n  --accent-hover:     var(--green-200);\n  --accent-subtle:    rgba(18, 209, 142, 0.14);\n\n  --surface-page:     var(--ink-950);\n  --surface-raised:   var(--ink-850);\n  --surface-card:     var(--ink-800);\n  --surface-card-hi:  var(--ink-700);\n  --surface-inset:    var(--ink-900);\n  --surface-overlay:  rgba(8, 8, 12, 0.72);\n\n  --border:           var(--ink-500);\n  --border-subtle:    var(--ink-600);\n  --border-strong:    var(--ink-400);\n\n  --text-body:        var(--text-mid);\n  --text-heading:     var(--text-hi);\n  --text-muted:       var(--text-lo);\n  --text-link:        var(--red-300);\n  --text-link-hover:  var(--red-200);\n  --focus-ring:       rgba(255, 61, 87, 0.55);\n\n  --success:          var(--green-300);\n  --success-subtle:   var(--green-50);\n}\n\n/* ============================================================\n   Certflix — Typography tokens\n   Display: Space Grotesk · Body: Plus Jakarta Sans · Mono: JetBrains Mono\n   ============================================================ */\n\n:root {\n  --font-display: \"Space Grotesk\", \"Segoe UI\", system-ui, sans-serif;\n  --font-body:    \"Plus Jakarta Sans\", system-ui, -apple-system, sans-serif;\n  --font-mono:    \"JetBrains Mono\", ui-monospace, \"SF Mono\", monospace;\n\n  /* Type scale (rem-ish, in px for clarity) — 1.20 minor-third-ish */\n  --fs-display-2xl: 72px;   /* hero */\n  --fs-display-xl:  56px;\n  --fs-display-lg:  44px;\n  --fs-h1:          36px;\n  --fs-h2:          28px;\n  --fs-h3:          22px;\n  --fs-h4:          18px;\n  --fs-body-lg:     18px;\n  --fs-body:        16px;\n  --fs-body-sm:     14px;\n  --fs-caption:     13px;\n  --fs-micro:       11px;\n\n  /* Weights */\n  --fw-light:    300; /* @kind other */\n  --fw-regular:  400; /* @kind other */\n  --fw-medium:   500; /* @kind other */\n  --fw-semibold: 600; /* @kind other */\n  --fw-bold:     700; /* @kind other */\n\n  /* Line heights */\n  --lh-tight:   1.05; /* @kind other */\n  --lh-snug:    1.2; /* @kind other */\n  --lh-normal:  1.5; /* @kind other */\n  --lh-relaxed: 1.65; /* @kind other */\n\n  /* Letter spacing */\n  --ls- span style=\"padding:3px 11px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;font-weight:600\">co-op<\u002Fspan><span style=\"padding:3px 11px;border-radius:99px;border:1px solid var(--ink-500);font-size:12px\">cosy<\u002Fspan><span style=\"padding:3px 11px;border-radius:99px;border:1px solid var(--ink-500);font-size:12px\">rejoué<\u002Fspan><\u002Fdiv>\n<div style=\"margin:6px 12px;padding:7px 12px;border-radius:10px;border:1px solid var(--ink-500);color:var(--text-lo);font-size:13px\">nouveau tag… ↵<\u002Fdiv>\n<div style=\"font:600 11px 'Plus Jakarta Sans';letter-spacing:.12em;color:var(--text-lo);padding:8px 12px 4px\">COLLECTIONS<\u002Fdiv>\n<div style=\"padding:7px 12px;display:flex;gap:10px;align-items:center\"><i style=\"width:16px;height:16px;border-radius:5px;background:var(--brand);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center\">✓<\u002Fi>À finir<\u002Fdiv><div style=\"padding:7px 12px;display:flex;gap:10px;align-items:center\"><i style=\"width:16px;height:16px;border-radius:5px;border:1.5px solid var(--ink-400)\"><\u002Fi>Roguelikes<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n<!-- 8 Réglages -->\n<div id=\"m8\" style=\"display:flex;flex-direction:column;gap:12px\"><span style=\"font:600 13px 'JetBrains Mono',monospace;color:#F4F4F8\">08 · Réglages — métadonnées et clés API (1j)<\u002Fspan>\n<div style=\"width:1280px;height:800px;border-radius:16px;overflow:hidden;background:var(--surface-page);border:1px solid var(--ink-600);display:flex;flex-direction:column\">\n<div style=\"height:36px;flex:none;background:var(--ink-900);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--text-lo)\"><i style=\"width:11px;height:11px;border-radius:50%;background:#FF5F57\"><\u002Fi><i style=\"width:11px;height:11px;border-radius:50%;background:#FEBC2E\"><\u002Fi><i style=\"width:11px;height:11px;border-radius:50%;background:#28C840\"><\u002Fi><span style=\"margin-left:8px\">Réglages<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex:1;min-height:0\">\n<div style=\"width:248px;flex:none;background:var(--ink-900);border-right:1px solid var(--ink-600);padding:22px 14px;display:flex;flex-direction:column;gap:3px;box-sizing:border-box\"><b style=\"font:700 18px 'Space Grotesk';color:#F4F4F8;padding:0 6px 10px\">Réglages<\u002Fb><sc-for list=\"{{ setNav }}\" as=\"s\" hint-placeholder-count=\"6\"><div style=\"{{ s.st }}\">{{ s.l }}<\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div style=\"flex:1;padding:32px 48px;display:flex;flex-direction:column;gap:20px;max-width:800px\">\n<b style=\"font:700 30px 'Space Grotesk';color:#F4F4F8;letter-spacing:-.02em\">Métadonnées et images<\u002Fb>\n<div style=\"padding:24px;border-radius:20px;background:var(--ink-800);border:1px solid var(--ink-600);display:flex;flex-direction:column;gap:16px\"><div style=\"display:flex;align-items:center\"><b style=\"font:700 18px 'Space Grotesk';color:#F4F4F8\">IGDB (Twitch)<\u002Fb><span style=\"margin-left:auto;padding:4px 12px;border-radius:99px;background:var(--accent-subtle);color:var(--green-300);font-size:13px;font-weight:600\">✓ connecté<\u002Fspan><\u002Fdiv>\n<x-import component-from-global-scope=\"CertflixDesignSystem_0dfe93.Input\" label=\"Client ID\" value=\"••••••••••••••••\" hint-size=\"100%,72px\"><\u002Fx-import>\n<x-import component-from-global-scope=\"CertflixDesignSystem_0dfe93.Input\" label=\"Secret\" value=\"••••••••••••••••\" hint-size=\"100%,72px\"><\u002Fx-import>\n<div><x-import component-from-global-scope=\"CertflixDesignSystem_0dfe93.Button\" variant=\"outline\" size=\"md\" hint-size=\"auto,44px\">Tester la connexion<\u002Fx-import><\u002Fdiv><\u002Fdiv>\n<div style=\"padding:24px;border-radius:20px;background:var(--ink-800);border:1px solid var(--ink-600);display:flex;flex-direction:column;gap:16px\"><b style=\"font:700 18px 'Space Grotesk';color:#F4F4F8\">SteamGridDB<\u002Fb>\n<div style=\"display:flex;gap:12px;align-items:flex-end\">< :'124',dot:true,st:item()},{l:'Epic',n:'31',dot:true,st:item()},\n      {l:'COLLECTIONS',n:'',st:head},{l:'Co-op',n:'14',st:item()},{l:'À finir',n:'8',st:item()},\n      {l:'Réglages',n:'',st:item() + ';margin-top:auto'}\n    ];\n    const chip = a => 'padding:6px 16px;border-radius:99px;font-size:13px;font-weight:600;' + (a ? 'background:#F4F4F8;color:#14141C' : 'border:1px solid var(--ink-500);color:var(--text-mid)');\n    const chips1 = [{l:'Tous',st:chip(true)},{l:'Installés',st:chip()},{l:'♥ Favoris',st:chip()},{l:'Tag ▾',st:chip()}];\n    const rs = a => 'width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;' + (a ? 'background:var(--brand-subtle);color:var(--red-300)' : 'color:var(--text-lo)');\n    const rail = [{i:'▦',st:rs(true)},{i:'♥',st:rs()},{i:'◷',st:rs()},{i:'▤',st:rs()},{i:'⚙',st:rs() + ';margin-top:auto'}];\n    const mt = a => 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border-radius:14px;' + (a ? 'border:2px solid var(--brand);background:var(--brand-subtle);box-shadow:var(--glow-brand)' : 'border:2px solid transparent');\n    const matches = [{t:'Hollow Knight ◉',bg:bg(1),st:mt(true)},{t:'Hollow Knight: Silksong',bg:bg(2),st:mt()},{t:'Aucun / saisir',bg:'var(--ink-700)',st:mt()}];\n    const lc = a => 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:28px 18px;border-radius:20px;background:var(--ink-800);' + (a ? 'border:1.5px solid var(--green-300);box-shadow:var(--glow-accent)' : 'border:1.5px dashed var(--ink-500);opacity:.7');\n    const ck = a => 'margin-top:8px;font-size:13px;font-weight:600;' + (a ? 'color:var(--green-300)' : 'color:var(--text-lo)');\n    const launchers = [\n      {k:'S',n:'Steam',c:'124 jeux',m:'✓ Inclus',bg:'linear-gradient(160deg,#1b6fa8,#12263a)',st:lc(true),ck:ck(true)},\n      {k:'E',n:'Epic',c:'31 jeux',m:'✓ Inclus',bg:'linear-gradient(160deg,#4a4a5e,#16161f)',st:lc(true),ck:ck(true)},\n      {k:'G',n:'GOG',c:'non trouvé',m:'Non détecté',bg:'var(--ink-700)',st:lc(false),ck:ck(false)}];\n    const cols = [{l:'À finir',n:'8',st:item(true)},{l:'Co-op',n:'14',st:item()},{l:'Roguelikes',n:'22',st:item()},{l:'+ nouvelle',n:'',st:item() + ';color:var(--text-lo)'}];\n    const setNav = ['Métadonnées','Launchers','Dossiers et exclusions','Apparence','Raccourcis','Cache'].map((l, i) => ({l, st: item(i === 0)}));\n    const shots = [3,5,10].map(i => ({bg: bg(i)}));\n    return { sb1, chips1, g1: mk(12, 2, {dim: 11}), rail, g2: mk(14), matches, launchers, cols, g6: mk(7), g7: mk(14, 1), setNav, shots };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
