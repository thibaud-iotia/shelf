# Packaging for the three OSes. Auto-update: electron-updater reads the GitHub releases
# (publish below). See feature/app-update.md.
appId: fr.perso.shelf
productName: Shelf
copyright: Copyright © 2026 Thibaud
directories:
  output: release
  # icon.png (1024 px) is converted to .ico / .icns by electron-builder.
  buildResources: resources
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  # SQL migrations, applied at startup (paths.migrations()).
  - from: drizzle
    to: drizzle
  # Tray and window icons (paths.trayIcon(), paths.appIcon()).
  - from: resources
    to: resources
    filter: ['*.png']
asarUnpack:
  - node_modules/better-sqlite3/**
# better-sqlite3 ships N-API prebuilds that already match Electron: no native rebuild.
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Shelf
linux:
  target: [AppImage, deb]
  category: Game
  maintainer: Thibaud
  synopsis: Bibliothèque de jeux multi-launchers
  desktop:
    entry:
      StartupWMClass: Shelf
mac:
  target: dmg
  category: public.app-category.games
  # Personal build: unsigned. Gatekeeper asks once (right click › Open).
  identity: null
# Update feed. electron-builder writes app-update.yml into resources/ (read by electron-updater)
# and latest.yml / latest-linux.yml / latest-mac.yml next to the installers. It never uploads
# anything itself (`--publish never`): the CI attaches these files to the release. Must name
# the repository the releases go to (vars.RELEASES_REPO in the CI, this one by default).
publish:
  provider: github
  owner: thibaud-iotia
  repo: shelf
  releaseType: release
